# Runs on every push and pull request to main: the same checks as Unopsis.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fail if db.sqlite3 is not committed
        run: |
          if git ls-files --error-unmatch db.sqlite3 > /dev/null 2>&1; then
            echo "OK: db.sqlite3 is tracked by git."
          else
            echo "::error file=db.sqlite3::db.sqlite3 is not committed. Run 'git add db.sqlite3'."
            exit 1
          fi

      - name: Fail if .env was committed
        run: |
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "::error file=.env::.env is committed. It contains real secrets. Remove it and commit only .env.example."
            exit 1
          else
            echo "OK: .env is not tracked by git."
          fi

      - name: Create .env for this run
        run: |
          {
            echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
            echo "ALLOWED_HOSTS=localhost,127.0.0.1"
            echo "AI_LOCAL_ENABLED=False"
          } > .env

      - name: Django check (development settings)
        run: python manage.py check

      - name: Django check (production settings)
        run: python manage.py check --settings=voxsite.settings.production

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run the test suite
        run: python manage.py test

      - name: collectstatic (production settings)
        run: python manage.py collectstatic --noinput --settings=voxsite.settings.production
